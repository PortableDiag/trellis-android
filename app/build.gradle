plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.trellis.viewer'
    compileSdk 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.trellis.viewer"
        minSdk 26
        targetSdk 35
        versionCode 36
        versionName "0.30.0"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                storeFile file("${project.rootDir}/${keystoreProperties['storeFile']}")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    // A release build without the keystore used to produce app-release-UNSIGNED.apk
    // and say so only in the filename — which is how six releases went out carrying
    // the debug-signed APK instead. Fail loudly rather than emit an artifact that
    // cannot be shipped.
    tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }
         .configureEach { task ->
        task.doFirst {
            if (!keystoreProperties['storeFile']) {
                throw new GradleException(
                    "No keystore.properties — this build would produce an unsigned APK.\n" +
                    "Create keystore.properties beside build.gradle with storeFile /\n" +
                    "storePassword / keyAlias / keyPassword (see README → Releasing).\n" +
                    "Never ship the debug APK instead: its key is the same well-known\n" +
                    "key on every machine with the SDK.")
            }
        }
    }

    buildTypes {
        release {
            if (keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
        debug {
            if (keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Name the deprecated APIs rather than the "some input files" note — a
    // deprecation you cannot see is one you cannot decide about.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    // App lock. BiometricPrompt with the device credential as the fallback, so a
    // phone with no enrolled fingerprint still has a way in.
    implementation 'androidx.biometric:biometric:1.1.0'
    // CommonMark rendering for text cards (matches the desktop's markdown).
    implementation 'io.noties.markwon:core:4.6.2'
    // GFM tables. `core` alone renders a markdown table as its literal pipes and
    // dashes, which is unreadable on a phone — the desktop renders them, so the
    // viewer has to as well.
    implementation 'io.noties.markwon:ext-tables:4.6.2'
}
